<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Habit Ring</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="bar">
    <div>
      <p class="kicker">Daily practice</p>
      <h1>Habit Ring</h1>
    </div>
    <div class="bar-actions">
      <button type="button" class="ghost" id="exportBtn">Export</button>
      <button type="button" class="ghost" id="resetBtn">Reset sample</button>
      <button type="button" class="primary" id="addBtn">New habit</button>
    </div>
  </header>
  <main>
    <section class="stats" id="stats"></section>
    <section class="layout">
      <div>
        <h2 class="section-title">Today</h2>
        <p class="hint" id="todayLabel"></p>
        <div id="habitList"></div>
      </div>
      <aside>
        <h2 class="section-title">Calendar</h2>
        <div class="cal-head">
          <button type="button" class="icon-btn" id="prevMonth" aria-label="Previous month">‹</button>
          <strong id="monthLabel"></strong>
          <button type="button" class="icon-btn" id="nextMonth" aria-label="Next month">›</button>
        </div>
        <div class="cal-grid" id="calGrid"></div>
        <p class="hint" id="calHint">Select a habit to see its month.</p>
      </aside>
    </section>
  </main>
  <dialog id="habitDialog">
    <form id="habitForm" method="dialog">
      <h3 id="dialogTitle">New habit</h3>
      <label>Name <input name="name" required maxlength="40" placeholder="Walk 20 minutes" /></label>
      <label>Color
        <select name="color">
          <option value="#c45c26">Clay</option>
          <option value="#2f6f4e">Moss</option>
          <option value="#1f4e79">Ink</option>
          <option value="#8b3a4a">Wine</option>
          <option value="#b0892a">Brass</option>
        </select>
      </label>
      <fieldset>
        <legend>Active days</legend>
        <div class="days" id="dayToggles"></div>
      </fieldset>
      <menu>
        <button type="button" class="ghost" value="cancel" id="cancelDialog">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </menu>
    </form>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
